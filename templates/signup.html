<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - SaintScalperFX AI</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="auth-container">


<div class="auth-card">


<div class="logo">

<h1>🧠 SaintScalperFX</h1>

<p>
Join the AI Trading Intelligence Platform
</p>

</div>



<div class="card">


<h2>
🚀 Create Account
</h2>


<p class="subtitle">
Start analyzing your charts with AI
</p>



<form method="POST">


<label>
Full Name
</label>

<input 
type="text"
name="fullname"
placeholder="Enter your name"
required>



<label>
Email Address
</label>

<input 
type="email"
name="email"
placeholder="Enter your email"
required>



<label>
Password
</label>

<input 
type="password"
name="password"
placeholder="Create password"
required>



<button type="submit">

Create Account

</button>


</form>



<br>


<p class="subtitle">

Already have an account?

<a href="/login">
Login
</a>

</p>


</div>


</div>


</div>


</body>

</html>
